name: ciri-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - ciri-net-tests

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=test
      - REACT_URL=http://localhost:3000
      - ADMIN_USERNAME=test-admin
      - ADMIN_PASSWORD_HASH=scrypt:16384:8:1:000102030405060708090a0b0c0d0e0f:d7590aca2c9801cf06eeba772a69dc31ce3862591d96522ac4e6bba6ad1f31a52d6f736f2b85adaa6262335eb112e56f014f417a37d74be0def7669b2c51c29e
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=test_db
    command: >
      sh -c "npm run test && npm run test:e2e"
    volumes:
      - ../backend/test-results:/app/test-results
    networks:
      - ciri-net-tests

networks:
  ciri-net-tests:
