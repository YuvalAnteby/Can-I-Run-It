name: ciri-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - ciri-net-tests

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=test
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=test_db
      - AZURE_DB_TEST_HOST=postgres
      - AZURE_DB_TEST_PORT=5432
      - AZURE_DB_TEST_USER=username
      - AZURE_DB_TEST_PASSWORD=changeme
    command: >
      sh -c "npm run test && npm run test:e2e"
    volumes:
      - ../backend/test-results:/app/test-results
      - ../infra:/infra:ro
    networks:
      - ciri-net-tests

networks:
  ciri-net-tests:
