name: ciri-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - ciri-net-tests

  rabbitmq:
    image: rabbitmq:4.3.5-alpine@sha256:3486d98205df3d6395ed70e7924baa13b561cbac54116c0ddae5b0b7382bbabd
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=ciri-test
      - RABBITMQ_DEFAULT_PASS=ciri-test-password
      - RABBITMQ_NODENAME=rabbit@rabbitmq
    volumes:
      - rabbitmqdata-test:/var/lib/rabbitmq
    networks:
      - ciri-net-tests
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - NODE_ENV=test
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=test_db
      - RABBITMQ_URL=amqp://ciri-test:ciri-test-password@rabbitmq:5672
    command: >
      sh -c "npm run test && npm run test:e2e"
    volumes:
      - ../backend/test-results:/app/test-results
    networks:
      - ciri-net-tests

networks:
  ciri-net-tests:

volumes:
  rabbitmqdata-test:
