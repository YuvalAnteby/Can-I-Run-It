name: can-i-run-it-prod
services:
  # NestJS backend (Production)
  backend:
    container_name: ciri-backend-prod
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      target: prod
    environment:
      - REACT_URL=${REACT_URL:-}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ciri-net-prod

  # React Frontend (Production - Nginx)
  react:
    container_name: ciri-frontend-prod
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
      target: prod
      args:
        - VITE_API_URL=http://${API_DOMAIN:-localhost}:${BACKEND_PORT}/api
    env_file:
      - .env
    ports:
      - "${REACT_PORT}:80" # Nginx listens on 80 inside the container
    networks:
      - ciri-net-prod

  # Postgres (Same as dev, but separate container/volume name to avoid conflicts)
  postgres:
    image: postgres:16-alpine
    container_name: ciri-postgres-prod
    restart: always
    # TODO: remove port exposing
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - ciri-net-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata-prod:

networks:
  ciri-net-prod:
