name: can-i-run-it-prod
services:
  # NestJS backend (Production)
  backend:
    container_name: ciri-backend-prod
    restart: always
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      target: prod
    environment:
      - REACT_URL=${REACT_URL:-}
      - PORT=${BACKEND_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL must be set}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:$${PORT:-4000}/api/health/postgres > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ciri-net-prod

  # React Frontend (Production - Nginx)
  react:
    container_name: ciri-frontend-prod
    restart: always
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set}
    ports:
      - "${REACT_PORT}:80" # Nginx listens on 80 inside the container
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ciri-net-prod

  # Postgres (Same as dev, but separate container/volume name to avoid conflicts)
  postgres:
    image: postgres:16-alpine
    container_name: ciri-postgres-prod
    restart: always
    # TODO: remove port exposing
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - ciri-net-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RabbitMQ broker (production, no host ports)
  rabbitmq:
    image: rabbitmq:4.3.5-alpine@sha256:3486d98205df3d6395ed70e7924baa13b561cbac54116c0ddae5b0b7382bbabd
    hostname: rabbitmq
    container_name: ciri-rabbitmq-prod
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
      - RABBITMQ_NODENAME=rabbit@rabbitmq
    volumes:
      - rabbitmqdata-prod:/var/lib/rabbitmq
    networks:
      - ciri-net-prod
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata-prod:
  rabbitmqdata-prod:

networks:
  ciri-net-prod:
