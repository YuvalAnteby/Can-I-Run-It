name: can-i-run-it-prod
services:
  # NestJS backend (Production)
  backend:
    container_name: ciri-backend-prod
    restart: always
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      target: prod
    environment:
      - REACT_URL=${REACT_URL:?REACT_URL must be set}
      - NODE_ENV=production
      - PORT=4000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - RAWG_API_KEY=${RAWG_API_KEY:-}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:$${PORT:-4000}/api/health/postgres > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ciri-net-prod

  # Postgres (Same as dev, but separate container/volume name to avoid conflicts)
  postgres:
    image: postgres:16-alpine
    container_name: ciri-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - ciri-net-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata-prod:

networks:
  ciri-net-prod:
