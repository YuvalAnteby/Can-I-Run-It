name: can-i-run-it
services:
  # NestJS backend
  backend:
    container_name: ciri-backend
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
      target: dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_URL=${REACT_URL:-http://react}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL must be set}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/:/app/
      - /app/node_modules
    networks:
      - ciri-net

  # React (TS) frontend
  react:
    container_name: ciri-frontend
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
      target: dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_PORT=${REACT_PORT:-3000}
      - VITE_API_URL=http://${API_DOMAIN:-localhost}:${BACKEND_PORT:-4000}/api
    ports:
      - "${REACT_PORT:-3000}:${REACT_PORT:-3000}"
    networks:
      - ciri-net
    volumes:
      - ../frontend/:/app/
      - /app/node_modules

  # Postgres database
  postgres:
    image: postgres:16-alpine
    container_name: ciri-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-username}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-myciridb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - ciri-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-username} -d ${POSTGRES_DB:-myciridb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RabbitMQ broker (development with management UI)
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
    hostname: rabbitmq
    container_name: ciri-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
      - RABBITMQ_NODENAME=rabbit@rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - ciri-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  rabbitmqdata:

networks:
  ciri-net:
