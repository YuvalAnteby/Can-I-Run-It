name: CI - Backend Checks

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"
      - "!**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Lint backend
        run: npm run lint --prefix backend
      - name: Type-check backend
        run: npm run typecheck --prefix backend
      - name: Test backend
        run: npm test --prefix backend
      - name: Build backend
        run: npm run build --prefix backend

  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static_analysis
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run Docker-backed tests
        run: docker compose -f infra/docker-compose.tests.yml up --build --exit-code-from backend --abort-on-container-exit

  dry_run_build:
    runs-on: ubuntu-latest
    needs: integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify Docker build
        run: docker build -f infra/Dockerfile.backend -t temp-check:latest ./backend
